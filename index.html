<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pra Você 💙</title>

<style>
body{
  margin:0;height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#dbeafe,#e0f2fe,#f0f9ff);
}
.card{
  width:350px;padding:30px;text-align:center;
  background:rgba(255,255,255,.95);
  border-radius:26px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  z-index:2;
}
h1{color:#2563eb;font-size:22px;margin-bottom:10px}
p{color:#334155;font-size:16px;line-height:1.6}
button{
  width:100%;padding:14px;margin-top:12px;
  border:none;border-radius:30px;
  background:linear-gradient(135deg,#3b82f6,#60a5fa);
  color:#fff;font-size:16px;cursor:pointer;
}
button:hover{opacity:.95}
.hidden{display:none}
.spotify{
  background:linear-gradient(135deg,#1DB954,#1ed760);
}

/* corações */
.heart{
  position:absolute;top:-20px;
  color:rgba(59,130,246,.6);
  font-size:18px;animation:cair linear infinite;
}
@keyframes cair{
  to{transform:translateY(110vh);opacity:0}
}
</style>
</head>

<body>

<div class="card">
  <h1>Tenho algo pra você… 💙</h1>
  <p id="pergunta"></p>

  <button id="btn1" onclick="responder()"></button>
  <button id="btn2" onclick="responder()"></button>

  <div id="final" class="hidden">
    <p style="font-size:17px; color:#1e40af;">
      <strong>
      Te amo meu amor e estou contando os dias para sentir seus carinhos.
      Amo ter você perto de mim.
      Você é muito especial.
      Lhe dedico essa música porque você merece tudo 💙
      </strong>
    </p>

    <button class="spotify" onclick="abrirSpotify()">
      Ouvir nossa música 🎶
    </button>
  </div>
</div>

<script>
let indice = 0;

const perguntas = [
  {
    texto: "O que mais faz falta quando penso em você?",
    opcoes: ["Seu cheiro 💙", "O silêncio"]
  },
  {
    texto: "O que eu mais quero agora?",
    opcoes: ["Te ver logo 😍", "Dormir"]
  },
  {
    texto: "O que mais me deixa feliz quando lembro de você?",
    opcoes: ["Seu abraço 🤍", "O tempo passando"]
  }
];

function mostrarPergunta(){
  if(indice < perguntas.length){
    document.getElementById("pergunta").innerText = perguntas[indice].texto;
    document.getElementById("btn1").innerText = perguntas[indice].opcoes[0];
    document.getElementById("btn2").innerText = perguntas[indice].opcoes[1];
  }else{
    document.getElementById("btn1").style.display="none";
    document.getElementById("btn2").style.display="none";
    document.getElementById("pergunta").style.display="none";
    document.getElementById("final").classList.remove("hidden");
  }
}

function responder(){
  indice++;
  mostrarPergunta();
}

function abrirSpotify(){
  window.open(
    "https://open.spotify.com/track/5QJ5mJ8z6QxJ2lQ0bQKJbR",
    "_blank"
  );
}

mostrarPergunta();

/* corações */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💙";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
},450);
</script>

</body>
</html>
