<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pra Você 💙</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #dbeafe, #e0f2fe, #f0f9ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
}

.card {
  background: rgba(255,255,255,0.9);
  border-radius: 26px;
  padding: 30px;
  width: 350px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  z-index: 2;
}

h1 {
  color: #2563eb;
  font-size: 22px;
}

p {
  color: #334155;
  font-size: 16px;
  line-height: 1.6;
}

button {
  margin-top: 15px;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.hidden {
  display: none;
}

.spotify {
  background: linear-gradient(135deg, #1DB954, #1ed760);
}

/* CORAÇÕES */
.heart {
  position: absolute;
  top: -20px;
  color: rgba(59,130,246,0.6);
  font-size: 18px;
  animation: cair linear infinite;
}

@keyframes cair {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1 id="titulo">Tenho algo pra você…</h1>
  <p id="texto">Clica com calma 💙</p>

  <button id="btn1" onclick="responder()">Continuar</button>
  <button id="btn2" onclick="responder()">Continuar</button>

  <div id="final" class="hidden">
    <p>
      Não é um jogo.<br><br>
      É sobre o que eu sinto por você.
    </p>

    <p>
      Eu sinto muita saudade do seu cheiro,<br>
      do seu carinho,<br>
      da sua presença.
    </p>

    <p>
      Já conto os dias pra te ver,<br>
      te abraçar,<br>
      e sentir tudo isso de novo.
    </p>

    <p style="font-size:18px; color:#1e40af;">
      Eu te amo 💙
    </p>

    <button class="spotify" onclick="abrirSpotify()">
      Ouvir nossa música 🎶
    </button>
  </div>
</div>

<script>
let etapa = 0;

const etapas = [
  "O que mais faz falta quando penso em você?",
  "O que eu mais quero agora?",
  "O que nunca saiu do meu coração?",
  "Agora é de coração…"
];

function responder() {
  if (etapa < etapas.length) {
    document.getElementById("texto").innerText = etapas[etapa];
    etapa++;
  } else {
    document.getElementById("btn1").style.display = "none";
    document.getElementById("btn2").style.display = "none";
    document.getElementById("texto").style.display = "none";
    document.getElementById("final").classList.remove("hidden");
  }
}

function abrirSpotify() {
  window.open(
    "https://open.spotify.com/search/Tudo%20Que%20Voc%C3%AA%20Quiser%20Luan%20Santana",
    "_blank"
  );
}

/* CORAÇÕES */
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💙";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}, 450);
</script>

</body>
</html>
