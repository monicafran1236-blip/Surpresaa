<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz do Amor 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #333;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 25px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
  color: #ff3366;
}

button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border: none;
  border-radius: 25px;
  background: #ff3366;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #e6005c;
}

#resultado {
  display: none;
  font-size: 18px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="titulo">Quiz do Amor 💘</h1>
  <p id="pergunta">Pronta pra começar?</p>

  <button onclick="responder(1)">Sim 😍</button>
  <button onclick="responder(0)">Claro 💖</button>

  <div id="resultado"></div>
</div>

<script>
let etapa = 0;
let pontos = 0;

const perguntas = [
  {
    texto: "O que mais importa pra mim?",
    respostas: ["Você 💕", "Dinheiro 💸"],
    certa: 0
  },
  {
    texto: "O que eu mais gosto quando penso em você?",
    respostas: ["Seu sorriso 😍", "Dormir 😂"],
    certa: 0
  },
  {
    texto: "Vale a pena tentar algo sério comigo?",
    respostas: ["Sim ❤️", "Óbvio 😘"],
    certa: 1
  }
];

function responder(escolha) {
  if (etapa === 0) {
    etapa++;
    carregarPergunta();
    return;
  }

  if (escolha === perguntas[etapa - 1].certa) {
    pontos++;
  }

  etapa++;
  if (etapa <= perguntas.length) {
    carregarPergunta();
  } else {
    mostrarFinal();
  }
}

function carregarPergunta() {
  document.getElementById("pergunta").innerText = perguntas[etapa - 1].texto;
  const botoes = document.querySelectorAll("button");
  botoes[0].innerText = perguntas[etapa - 1].respostas[0];
  botoes[1].innerText = perguntas[etapa - 1].respostas[1];
}

function mostrarFinal() {
  document.getElementById("pergunta").style.display = "none";
  document.querySelectorAll("button").forEach(b => b.style.display = "none");

  let msg = "";
  if (pontos >= 2) {
    msg = "Resultado: 💖💖💖<br>Você é muito especial pra mim.<br>Quero tentar algo com você 😍";
  } else {
    msg = "Resultado: 💕<br>Mesmo assim… gosto muito de você 💌";
  }

  const res = document.getElementById("resultado");
  res.innerHTML = msg;
  res.style.display = "block";
}
</script>

</body>
</html>
