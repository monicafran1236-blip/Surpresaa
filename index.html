<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pra Você 💙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #dbeafe, #e0f2fe, #f0f9ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
}

.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-radius: 26px;
  padding: 30px;
  width: 350px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.15);
  animation: surgir 1s ease;
  z-index: 2;
}

@keyframes surgir {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-size: 22px;
  margin-bottom: 15px;
  color: #2563eb;
}

p {
  font-size: 16px;
  line-height: 1.6;
  color: #334155;
}

button {
  margin-top: 18px;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 20px rgba(59,130,246,0.4);
}

.hidden {
  display: none;
}

.spotify {
  background: linear-gradient(135deg, #1DB954, #1ed760);
}

/* 💙 CORAÇÕES CAINDO */
.heart {
  position: absolute;
  top: -20px;
  color: rgba(59,130,246,0.6);
  font-size: 20px;
  animation: cair linear infinite;
}

@keyframes cair {
  0% {
    transform: translateY(-10px);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <h1 id="titulo">Tenho algo pra você…</h1>
  <p id="texto">Vamos ver se você descobre 💭</p>

  <button onclick="responder()">Vamos 💙</button>
  <button onclick="responder()">Quero ver 💫</button>

  <div id="final" class="hidden">
    <p>
      Não é sobre acertar perguntas…<br><br>
      É sobre o que eu sinto por você.
    </p>

    <p>
      Eu sinto muita saudade do seu cheiro,<br>
      do seu carinho,<br>
      da sua presença comigo.
    </p>

    <p>
      Já conto os dias pra te ver,<br>
      te abraçar,<br>
      e sentir tudo isso de novo.
    </p>

    <p style="font-size:18px; color:#1e40af;">
      Eu te amo 💙
    </p>

    <button class="spotify" onclick="abrirSpotify()">
      Ouvir nossa música 🎶
    </button>
  </div>
</div>

<script>
let etapa = 0;
const frases = [
  "O que mais faz falta quando penso em você?",
  "O que eu mais quero agora?",
  "O que nunca saiu do meu coração?"
];

function responder() {
  if (etapa < frases.length) {
    document.getElementById("texto").innerText = frases[etapa];
    etapa++;
  } else {
    document.getElementById("titulo").innerText = "Agora é de coração…";
    document.getElementById("texto").style.display = "none";
    document.querySelectorAll("button")[0].style.display = "none";
    document.querySelectorAll("button")[1].style.display = "none";
    document.getElementById("final").classList.remove("hidden");
  }
}

function abrirSpotify() {
  window.open(
    "https://open.spotify.com/search/Tudo%20Que%20Voc%C3%AA%20Quiser%20Luan%20Santana",
    "_blank"
  );
}

/* CRIAR CORAÇÕES */
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💙";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 8000);
}, 400);
</script>

</body>
</html>
